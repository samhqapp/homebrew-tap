name: Update Hushpen cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hushpen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Update version and sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/hushpen.rb
          tag=$(gh release view -R surajmandalcell/hushpen --json tagName -q .tagName)
          latest=${tag#v}
          [[ "$latest" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "unexpected tag: $tag"; exit 1; }
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")
          if [ "$latest" = "$current" ]; then
            echo "no change: $current is the latest release"
            exit 0
          fi
          asset="Hushpen-${latest}-macos-arm64.zip"
          gh release download "$tag" -R surajmandalcell/hushpen -p "$asset" -D "$RUNNER_TEMP"
          sha=$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"$/  version \"$latest\"/" \
                 -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Hushpen to $latest"
          git push
          echo "updated: $current -> $latest"
